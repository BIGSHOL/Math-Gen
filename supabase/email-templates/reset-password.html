<!--
  Supabase 대시보드 → Authentication → Email Templates → "Reset Password"
  의 본문(Message body)에 이 파일 내용을 붙여넣으세요.
  {{ .ConfirmationURL }} = 비밀번호 재설정 링크 (supabase 가 자동으로 채움).
  앱의 redirectTo (window.location.origin) 가 대시보드 → Authentication →
  URL Configuration 의 Redirect URLs 에 등록돼 있어야 링크가 동작합니다.
-->
<div style="margin:0;padding:0;background-color:#f3f4f6;font-family:'Apple SD Gothic Neo','Malgun Gothic',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background-color:#ffffff;border-radius:14px;border:1px solid #e5e7eb;">
          <tr>
            <td style="padding:32px 36px;">
              <div style="font-size:18px;font-weight:700;color:#075985;letter-spacing:-0.01em;">MathGen <span style="color:#9ca3af;font-weight:500;">/ 변환</span></div>
              <h1 style="margin:24px 0 0;font-size:20px;font-weight:700;color:#111827;">비밀번호 재설정</h1>
              <p style="margin:12px 0 0;font-size:14px;line-height:1.7;color:#4b5563;">
                비밀번호 재설정을 요청하셨습니다. 아래 버튼을 눌러 새 비밀번호를 설정하세요. 보안을 위해 이 링크는 일정 시간이 지나면 만료됩니다.
              </p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
                <tr>
                  <td style="border-radius:8px;background-color:#0EA5E9;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:12px 28px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">
                      비밀번호 재설정하기
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-size:12px;line-height:1.7;color:#6b7280;">
                버튼이 작동하지 않으면 아래 주소를 복사해 브라우저에 붙여넣으세요:
              </p>
              <p style="margin:6px 0 0;font-size:12px;line-height:1.6;color:#0EA5E9;word-break:break-all;">
                {{ .ConfirmationURL }}
              </p>
              <hr style="margin:24px 0 0;border:none;border-top:1px solid #e5e7eb;" />
              <p style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#9ca3af;">
                본인이 요청하지 않았다면 이 메일을 무시하셔도 됩니다. 계정 비밀번호는 변경되지 않습니다.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
