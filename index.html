<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathGen 변환 — 시험지 변환 도구</title>

    <!-- Pretendard Variable (UI) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />

    <!-- JetBrains Mono (numbers, code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- 인쇄 6 template 의 5 폰트 팩 — Google Fonts preload all.
         사용자가 PrintOptionsPanel 의 *폰트* 옵션으로 선택. 한 번 download 후
         cache → 페이지 전체에서 즉시 적용. -->
    <!-- 나눔 (Nanum Myeongjo + Nanum Gothic) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- 노토 (Noto Serif KR + Noto Sans KR) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- 고운 (Gowun Batang + Gowun Dodum) — 부드러운 modern serif -->
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />

    <!-- KaTeX CSS — bundled via `import 'katex/dist/katex.min.css'` in
         index.tsx so Vite serves the WOFF2 font files too. The previous
         CDN <link> partially failed: KaTeX_Size1 / Size2 / AMS were never
         actually downloaded, which left √ and other large symbols rendered
         as empty (positioned but invisible) glyphs. -->

    <!-- Phosphor Icons web font (4 weights) -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css" />
  </head>
  <body class="h-screen overflow-hidden print:h-auto print:overflow-visible">
    <div id="root" class="h-full print:h-auto"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
