<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>수학 기출지 변환기 · 프로토타입</title>
<meta name="viewport" content="width=1400" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #F4F5F8; font-family: Pretendard, -apple-system, sans-serif; }
  body { overflow: auto; }
  #root { width: 100vw; height: 100vh; min-width: 1280px; min-height: 720px; }
  /* CJK doesn't break on word boundaries by default — keep short labels on one line */
  .nowrap, .app-root [data-nowrap="1"] { white-space: nowrap; }

  @keyframes wizSlideInRight {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes wizSlideInLeft {
    from { opacity: 0; transform: translateX(-40px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: #D8DCE3; border-radius: 6px; border: 2px solid #F4F5F8; }
  *::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Shared primitives (reused from wireframes) -->
<script type="text/babel" src="wireframes/primitives.jsx"></script>

<!-- Screens -->
<script type="text/babel" src="proto/library.jsx"></script>
<script type="text/babel" src="proto/detail.jsx"></script>
<script type="text/babel" src="proto/modal.jsx"></script>
<script type="text/babel" src="proto/wizard.jsx"></script>
<script type="text/babel" src="proto/wizard-steps.jsx"></script>

<!-- App last -->
<script type="text/babel" src="proto/app.jsx"></script>

<script type="text/babel" data-presets="react">
(() => {
  const App = window.App;
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
})();
</script>
</body>
</html>
